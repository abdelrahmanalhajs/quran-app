name: quran_app
description: "Quran app with audio recitation, translation, tafsir, prayer times, qiblah, athkar and daily hadith."
publish_to: 'none'

version: 1.0.0+21

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  easy_localization: ^3.0.7
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  geolocator: ^13.0.2
  adhan: ^2.0.0
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  intl: any
  home_widget: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/data/
    - assets/audio/
    - assets/icon/

  # Bundled so the proper Arabic faces always render offline. Previously
  # these came from google_fonts, which downloads at runtime — useless for
  # an offline Quran app, so the script fell back to a system font that
  # shaped the Uthmani text poorly (looked heavy and pixelated).
  fonts:
    - family: KFGQPC HAFS Uthmanic Script
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#F2EAD3"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F2EAD3"
    theme_color: "#BD9A3E"
