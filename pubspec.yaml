name: quran_app
description: "Quran app with audio recitation, translation, tafsir, prayer times, qiblah, athkar and daily hadith."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  easy_localization: ^3.0.7
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  hijri: ^3.0.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/data/
