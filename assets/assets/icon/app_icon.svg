<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>
    <mask id="crescentMask">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <circle cx="512" cy="216" r="58" fill="white"/>
      <circle cx="540" cy="200" r="46" fill="black"/>
    </mask>
  </defs>

  <!-- Background: full square fill so app-store icon corners aren't transparent -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0E6E55"/>

  <g clip-path="url(#circleClip)">
    <!-- Decorative arabesque ring, evoking the circular calligraphy medallion -->
    <circle cx="512" cy="512" r="472" fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.55"/>
    <circle cx="512" cy="512" r="446" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/>

    <!-- Petal flourishes around the rim, echoing the calligraphy roundel's curved strokes -->
    <g fill="#D4AF37" opacity="0.5">
      <g id="petal">
        <path d="M512 46 C 528 78 528 110 512 132 C 496 110 496 78 512 46 Z"/>
      </g>
      <use href="#petal" transform="rotate(30 512 512)"/>
      <use href="#petal" transform="rotate(60 512 512)"/>
      <use href="#petal" transform="rotate(90 512 512)"/>
      <use href="#petal" transform="rotate(120 512 512)"/>
      <use href="#petal" transform="rotate(150 512 512)"/>
      <use href="#petal" transform="rotate(180 512 512)"/>
      <use href="#petal" transform="rotate(210 512 512)"/>
      <use href="#petal" transform="rotate(240 512 512)"/>
      <use href="#petal" transform="rotate(270 512 512)"/>
      <use href="#petal" transform="rotate(300 512 512)"/>
      <use href="#petal" transform="rotate(330 512 512)"/>
    </g>

    <!-- Crescent and star, from the mosque motif -->
    <rect x="430" y="134" width="164" height="164" fill="#D4AF37" mask="url(#crescentMask)"/>
    <path fill="#D4AF37" d="M606 184 l9 20 22 3 -16 15 4 22 -19 -11 -19 11 4 -22 -16 -15 22 -3 Z"/>

    <!-- Mosque dome silhouette -->
    <g fill="#F5F1E6">
      <path d="M512 300
               C 430 300 392 372 392 432
               L 632 432
               C 632 372 594 300 512 300 Z"/>
      <rect x="392" y="432" width="240" height="26" fill="#F5F1E6"/>
      <rect x="476" y="244" width="14" height="40" fill="#D4AF37"/>
      <circle cx="483" cy="238" r="12" fill="#D4AF37"/>
    </g>

    <!-- Minaret accents: slender towers topped with a small onion cap -->
    <g fill="#F5F1E6">
      <rect x="332" y="392" width="18" height="112" rx="3"/>
      <path d="M341 348 C 327 358 327 378 341 392 C 355 378 355 358 341 348 Z"/>
      <rect x="336" y="338" width="10" height="14"/>

      <rect x="674" y="392" width="18" height="112" rx="3"/>
      <path d="M683 348 C 669 358 669 378 683 392 C 697 378 697 358 683 348 Z"/>
      <rect x="678" y="338" width="10" height="14"/>
    </g>

    <!-- Base platform -->
    <rect x="300" y="500" width="424" height="22" fill="#F5F1E6" opacity="0.9"/>

    <!-- Open Quran book -->
    <g>
      <path d="M512 560
               C 470 538 400 532 340 548
               L 340 700
               C 400 686 470 692 512 716
               Z" fill="#F5F1E6"/>
      <path d="M512 560
               C 554 538 624 532 684 548
               L 684 700
               C 624 686 554 692 512 716
               Z" fill="#F5F1E6"/>
      <path d="M512 560 L512 716" stroke="#D4AF37" stroke-width="6"/>
      <!-- Page lines suggesting text -->
      <g stroke="#0E6E55" stroke-width="5" opacity="0.55" stroke-linecap="round">
        <line x1="362" y1="580" x2="470" y2="568"/>
        <line x1="362" y1="608" x2="470" y2="598"/>
        <line x1="362" y1="636" x2="470" y2="628"/>
        <line x1="362" y1="664" x2="470" y2="658"/>
        <line x1="554" y1="568" x2="662" y2="580"/>
        <line x1="554" y1="598" x2="662" y2="608"/>
        <line x1="554" y1="628" x2="662" y2="636"/>
        <line x1="554" y1="658" x2="662" y2="664"/>
      </g>
    </g>

    <!-- Crossed pens / qalams beneath the book, from the second reference -->
    <g stroke="#D4AF37" stroke-width="16" stroke-linecap="round">
      <line x1="380" y1="690" x2="660" y2="800"/>
      <line x1="660" y1="690" x2="380" y2="800"/>
    </g>
    <g fill="#0E6E55">
      <polygon points="372,682 396,698 380,706 364,698"/>
      <polygon points="668,682 644,698 660,706 676,698"/>
    </g>
  </g>
</svg>
